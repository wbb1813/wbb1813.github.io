# Site Information
title: "Binbin Wang"
title_separator: "-"
name: "Binbin Wang"
description: "Bioinformatician | Single-Cell Analysis | Tumor Immunology"
url: "https://wbb1813.github.io" # Base URL
baseurl: "" # Leave empty if using GitHub Pages
repository: "wbb1813/wbb1813.github.io"

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes"
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Site Author
author:
  name: "Binbin Wang"
  avatar: "/assets/images/profile.jpg"
  bio: "Postdoctoral Fellow at National Cancer Institute, NIH. Computational biologist with 11 years of experience in bioinformatics and systems biology, specializing in precision oncology and immune checkpoint blockade (ICB) response prediction. Expertise in large-scale omics data analysis, algorithm development, and machine learning applications in cancer research. Developed multiple widely used computational frameworks, including MAGeCKFlute for CRISPR screen data analysis, DETACH, a computational method to enhance ICB prediction, and LiBIO, a liquid biomarker prediction tool for ICB therapy."
  location: "National Cancer Institute, NIH, Bethesda, Maryland, United States"
  email: "wangbinbintj@gmail.com"
  github: "wbb1813"
  linkedin: "https://www.linkedin.com/in/binbin-wang-55a425190"
  orcid: "https://orcid.org/0000-0003-2885-6428"
  googlescholar: "https://scholar.google.com/citations?user=3kWrm4cAAAAJ"
  researchgate: "https://www.researchgate.net/profile/Binbin-Wang-34"
  pubmed: "https://www.ncbi.nlm.nih.gov/pubmed/?term=binbin+wang"

# Navigation
breadcrumbs: true
read_more: "enabled"

# SEO Optimization
google_site_verification: ""
bing_site_verification: ""
yandex_site_verification: ""

# Social Sharing
social:
  type: "Person"
  name: "Binbin Wang"
  links:
    - "https://github.com/wbb1813"
    - "https://www.linkedin.com/in/binbin-wang-55a425190"
    - "https://orcid.org/0000-0003-2885-6428"
    - "https://scholar.google.com/citations?user=3kWrm4cAAAAJ"

# Pagination & Permalinks
paginate: 5
paginate_path: "/page:num/"
permalink: pretty

# Reading & Exclusions
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - node_modules
  - vendor

# Markdown Processing
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Collections (Publications, Research, Teaching)
collections:
  research:
    output: true
    permalink: /research/:path/
  publications:
    output: true
    permalink: /publications/:path/
  news:
    output: true
    permalink: /news/:path/

# Defaults (for automatic layouts)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: research
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

# Footer Customization
footer:
  links:
    - title: "GitHub"
      url: "https://github.com/wbb1813"
    - title: "LinkedIn"
      url: "https://www.linkedin.com/in/binbin-wang-55a425190"
    - title: "ORCID"
      url: "https://orcid.org/0000-0003-2885-6428"
    - title: "Google Scholar"
      url: "https://scholar.google.com/citations?user=3kWrm4cAAAAJ"

# Sitemap for SEO
sitemap:
  include_posts: true
  exclude:
    - "/404.html"
